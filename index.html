<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FPL Projections</title>

<style>
:root{
  --bg:#0e131c;
  --card:#151c28;
  --text:#e6edf7;
  --accent:#dd965f;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,sans-serif;
}

header{
  padding:32px 20px;
  border-bottom:1px solid #243044;
}

h1{
  margin:0;
  font-size:42px;
}

.subtitle{
  color:#8f9bb0;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.grid{
  display:grid;
  gap:16px;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
}

.card{
  background:var(--card);
  border-radius:12px;
  padding:20px;
}

.value{
  font-size:40px;
  color:var(--accent);
  font-weight:bold;
}
</style>
</head>

<body>

<header>
  <h1>FPL Projections</h1>
  <div class="subtitle">
    Neste generasjon FPL-analyse
  </div>
</header>

<div class="container">

  <div class="grid">

    <div class="card">
      <h2>Gameweek</h2>
      <div class="value">--</div>
    </div>

    <div class="card">
      <h2>Gjennomsnitt</h2>
      <div class="value">--</div>
    </div>

    <div class="card">
      <h2>Høyeste score</h2>
      <div class="value">--</div>
    </div>

  </div>

</div>

</body>
</html>
